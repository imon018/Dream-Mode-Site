name: Build Android APK & AAB

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/updates/**'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
      VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}

      VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
      VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
      VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}

      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
      GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}


    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Install Dependencies
        run: npm install


      - name: Generate Capacitor App Icons
        run: npx capacitor-assets generate


      - name: Create OTA Update Package
        run: npm run create:update


      - name: Commit & Push OTA Update Package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/updates

          if git diff --cached --quiet; then
            echo "No OTA update changes to commit"
          else
            git commit -m "chore: update OTA package [skip ci]"
            git push
          fi


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Setup Android Signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/dream-mode-release.keystore

          echo "storeFile=dream-mode-release.keystore" > android/app/keystore.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/app/keystore.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/app/keystore.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/app/keystore.properties
          echo "storeType=PKCS12" >> android/app/keystore.properties


      - name: Verify Keystore
        run: |
          keytool -list \
          -keystore android/app/dream-mode-release.keystore \
          -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"


      - name: Strip Unnecessary Assets Before Android Sync
        run: |
          # public/downloads (direct-download APK) and public/updates (OTA package)
          # get copied verbatim into dist/ by Vite, and then npx cap sync copies all
          # of dist/ into the Android app's assets. Embedding an already-compressed
          # ~19MB APK plus the OTA zip inside the outer APK barely compresses further,
          # so it was inflating every build by that same amount. Neither folder is
          # needed inside the app itself (the website serves them separately, and OTA
          # updates are fetched over the network at runtime), so we drop them here,
          # after the build/OTA-package steps and before Capacitor syncs the assets.
          rm -rf dist/downloads
          rm -rf dist/updates


      - name: Sync Capacitor
        run: npx cap sync android


      - name: Grant Gradle Permission
        run: chmod +x android/gradlew


      - name: Build Signed Release APK
        run: |
          cd android
          ./gradlew assembleRelease


      - name: Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease


      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DreamMode-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk


      - name: Upload Signed Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: DreamMode-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
