name: Recover Keystore (one-time use)

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Decode keystore and write properties file
        run: |
          mkdir -p recovered
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > recovered/dream-mode-release.keystore

          echo "storeFile=dream-mode-release.keystore" > recovered/keystore.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> recovered/keystore.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> recovered/keystore.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> recovered/keystore.properties

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: recovered-keystore
          path: recovered/
